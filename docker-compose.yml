name: ${COMPOSE_PROJECT_NAME:-vendeu-ganhou}

services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vendeu_ganhou}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_local_password}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-before-production}
      JWT_TTL: ${JWT_TTL:-3600}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-vendeu_ganhou}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_local_password}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile.test
    environment:
      APP_ENV: local
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-jwt-secret-before-production}
      JWT_TTL: ${JWT_TTL:-3600}
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-vendeu_ganhou}
      DB_USERNAME: ${MYSQL_USER:-app}
      DB_PASSWORD: ${MYSQL_PASSWORD:-app_local_password}
      TEST_BASE_URL: http://backend:8000
      TEST_DB_HOST: database
      TEST_DB_PORT: 3306
      TEST_DB_DATABASE: ${MYSQL_DATABASE:-vendeu_ganhou}
      TEST_DB_USERNAME: ${MYSQL_USER:-app}
      TEST_DB_PASSWORD: ${MYSQL_PASSWORD:-app_local_password}
    depends_on:
      database:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  mysql-data:
